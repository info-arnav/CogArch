# Control: one brain-like agent learning alone across domains.
# Compare with config/general.yaml (two agents). The untrained system is
# benchmarked once with `cogarch baseline`.

model:
  base: "Qwen/Qwen2.5-1.5B-Instruct"
  served_name: "Qwen/Qwen2.5-1.5B-Instruct"
  max_tokens: 768

inference:
  base_url: "http://localhost:8000/v1"
  max_concurrent_requests: 64

agents:
  names: [a]
  seeds: {a: 11}
  specialists: [logical, creative, skeptical, empathetic]
  share_discoveries: false
  discussion: true          # specialists revise after seeing each other's answers

environment:
  max_attempts: 3           # code and maths; multiple choice always gets 1
  feedback: binary          # agents are only told "wrong"
  execution_timeout_seconds: 10
  memory_limit_mb: 1024
  probes_per_problem: 6

data:
  domains: [code, math, reasoning, social]
  validation_per_domain: 25
  split_seed: 0

training:
  enabled: true
  lora_rank: 16
  lora_alpha: 32
  learning_rate: 2.0e-5
  beta: 0.1
  nll_weight: 1.0           # DPO + NLL on chosen (Pang et al., 2024)
  epochs: 3
  batch_size: 2
  grad_accumulation: 1
  max_length: 3072
  min_pairs: 4
  global_slots: 4
  rollback_threshold: 0.1

memory:
  enabled: true
  embedding_model: "BAAI/bge-small-en-v1.5"
  working_capacity: 10
  max_episodic: 2000
  retrieve_k: 3
  min_similarity: 0.5
  lessons_per_sleep: 5
  lessons_in_prompt: 5

evaluation:
  benchmarks: [humaneval, mbpp, gsm8k, math500, arc_challenge, siqa, emobench_eu, emobench_ea]
  max_items: 300            # agent/specialist modes; plain mode and EvalPlus run in full
  subset_seed: 0
  samples: 1
  validation_samples: 2
  specialists: true
  plain: true

experiment:
  name: v2-solo
  cycles: 5
  rounds_per_cycle: 100     # 25 per domain
  round_batch_size: 4
  output_dir: data/runs
