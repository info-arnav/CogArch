<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CogArch Live</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e3e2de;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
    --grid: #ecebe7; --pair: #2a78d6; --solo: #eb6834; --link: #1d63b8;
    --good: #006d00; --bad: #c03030;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #2d2d2b;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --grid: #2a2a28; --pair: #3987e5; --solo: #d95926; --link: #6aa8f0;
      --good: #4cc04c; --bad: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  h1 { font-size: 20px; margin: 0 0 2px; } h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  .sub { color: var(--text-secondary); margin: 0 0 16px; }
  .crumbs { color: var(--text-secondary); margin-bottom: 12px; font-size: 13px; }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
           padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .legend { display: flex; gap: 16px; color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
  .swatch { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  svg text { fill: var(--text-muted); font-size: 11px; }
  .tooltip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
             border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; z-index: 9; }
  .bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
  .bar > div { height: 100%; background: var(--text-secondary); border-radius: 3px; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border);
         color: var(--text-secondary); font-weight: normal; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  details { margin: 4px 0; } summary { cursor: pointer; color: var(--text-secondary); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--surface-2);
        padding: 8px; border-radius: 6px; max-height: 420px; overflow: auto; margin: 4px 0; }
  .msg { border-left: 3px solid var(--border); padding-left: 8px; margin: 6px 0; }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
  .kv > span:nth-child(odd) { color: var(--text-secondary); }
  .attempt { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 8px 0; }
  ul { margin: 4px 0; padding-left: 18px; }
</style>
</head>
<body>
<main id="app">Loading…</main>
<div class="tooltip" id="tip"></div>
<script>
const $ = (id) => document.getElementById(id);
const pct = (x) => x == null ? "–" : (100 * x).toFixed(0) + "%";
const pct1 = (x) => x == null ? "–" : (100 * x).toFixed(1) + "%";
const num = (x, d = 3) => x == null ? "–" : Number(x).toFixed(d);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc = encodeURIComponent;
const api = async (path) => { const r = await fetch(path); if (!r.ok) throw new Error(path); return r.json(); };
const mark = (ok) => ok ? `<span class="ok">✓</span>` : `<span class="no">✗</span>`;
const mean = (o) => { const v = Object.values(o || {}); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const delta = (a, b) => (a == null || b == null) ? "" : `${(b - a) * 100 >= 0 ? "+" : ""}${((b - a) * 100).toFixed(1)}`;
const mainScore = (s) => s == null ? null : (s.plus ?? s.accuracy ?? s.base);
let timer = null;

// ── overview ────────────────────────────────────────────────────────────────
function chart(runs) {
  const data = [];
  for (const run of runs) for (const agent of run.agents) {
    const pts = [{ c: 0, v: mean(run.baseline_validation[agent]) }];
    for (const c of run.cycles) pts.push({ c: c.cycle, v: mean(c.validation[agent]) });
    data.push({ label: `${run.name} · ${agent}`, cond: run.condition, pts: pts.filter(p => p.v != null) });
  }
  if (!data.length) return `<p class="sub">No runs yet.</p>`;
  const W = Math.max(600, $("app").clientWidth - 70), H = 240, m = { l: 40, r: 12, t: 8, b: 24 };
  const maxC = Math.max(1, ...runs.map(r => r.cycles_total));
  const vals = data.flatMap(s => s.pts.map(p => p.v));
  const lo = Math.max(0, Math.floor((Math.min(...vals, 1) - .05) * 10) / 10);
  const hi = Math.min(1, Math.ceil((Math.max(...vals, 0) + .05) * 10) / 10);
  const x = c => m.l + (W - m.l - m.r) * c / maxC, y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / Math.max(hi - lo, .1));
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += .1) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${pct(v)}</text>`;
  for (let c = 0; c <= maxC; c++) g += `<text x="${x(c)}" y="${H-6}" text-anchor="middle">${c}</text>`;
  for (const s of data) {
    const col = `var(--${s.cond})`;
    g += `<path d="${s.pts.map((p, i) => `${i ? "L" : "M"}${x(p.c)},${y(p.v)}`).join("")}" fill="none" stroke="${col}" stroke-width="2"/>`;
    for (const p of s.pts) g += `<circle cx="${x(p.c)}" cy="${y(p.v)}" r="4" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/><circle cx="${x(p.c)}" cy="${y(p.v)}" r="12" fill="transparent" data-tip="${esc(s.label)}<br>cycle ${p.c}: <b>${pct1(p.v)}</b>"/>`;
  }
  return `<svg width="${W}" height="${H}" role="img" aria-label="Validation accuracy by cycle">${g}</svg>`;
}

function benchTable(entries, title) {
  if (!entries.length) return "";
  const benches = Object.keys(entries[0].scores);
  const head = `<tr><th>System</th><th>Mode</th>${benches.map(b => `<th>${esc(b)}</th>`).join("")}</tr>`;
  const rows = entries.map(e => `<tr><td>${esc(e.system)}</td><td>${esc(e.mode)}</td>${benches.map(b => {
    const s = e.scores[b] || {};
    return `<td class="num">${s.plus != null ? `${pct1(s.base)} / ${pct1(s.plus)}` : pct1(s.accuracy)}</td>`;
  }).join("")}</tr>`).join("");
  return `<h3>${esc(title)}</h3><table>${head}${rows}</table><p class="sub">Code benchmarks show base / plus tests.</p>`;
}

function runCard(run) {
  const last = run.cycles[run.cycles.length - 1];
  const prog = run.stage === "finished" ? 1 : run.kind === "baseline" ? 0.5 : (run.cycles_done + (run.rounds_done || 0) / run.rounds_total) / run.cycles_total;
  const kv = (k, v) => `<span>${k}</span><span>${v}</span>`;
  let b = `<div class="kv">` + kv("Stage", esc(run.stage) + (run.rounds_done != null ? ` · ${run.rounds_done}/${run.rounds_total} problems` : "")) + kv("Model", esc(run.model));
  if (last) {
    b += kv("Solved (last cycle)", run.agents.map(a => `${a}: ${pct(mean(last.solved_rate[a]))}`).join(" · "));
    if (run.condition === "pair") b += kv("Learned from partner", run.agents.map(a => `${a}: ${last.learned_from_peer[a] ?? 0}`).join(" · "));
    b += kv("Discussion changed / fixed", run.agents.map(a => `${a}: ${pct(last.discussion_changed[a])} / ${pct(last.discussion_fixed[a])}`).join(" · "));
    b += kv("Validation", run.agents.map(a => `${a}: ${pct1(mean(last.validation[a]))}`).join(" · "));
  }
  b += `</div><details><summary>Log</summary><pre>${esc(run.log.join("\n"))}</pre></details>`;
  const tag = run.kind === "baseline" ? "untrained" : run.condition;
  return `<section class="panel"><h2><a href="#/run/${enc(run.name)}">${esc(run.name)}</a> <span class="tag">${tag}</span></h2><div class="bar"><div style="width:${(100 * prog).toFixed(0)}%"></div></div>${b}</section>`;
}

async function overview() {
  const all = await api("/api/runs");
  const runs = all.filter(r => r.kind === "run"), base = all.find(r => r.kind === "baseline");
  let bench = base && base.baseline_benchmarks.length ? benchTable(base.baseline_benchmarks, "Untrained system (baseline)") : `<p class="sub">Baseline benchmarks appear after <code>cogarch baseline</code>.</p>`;
  for (const r of runs) if (r.final_benchmarks.length) bench += benchTable(r.final_benchmarks, `After training: ${r.name}`);
  $("app").innerHTML = `<h1>CogArch Live</h1><p class="sub">Brain-like agents learning from "wrong" across domains · two together vs one alone · refreshes every 15s · ${new Date().toLocaleTimeString()}</p>
    <section class="panel"><h2>Validation accuracy by cycle (mean over domains; cycle 0 = untrained)</h2>
      <div class="legend"><span><span class="swatch" style="background:var(--pair)"></span>Pair (one line per agent)</span><span><span class="swatch" style="background:var(--solo)"></span>Solo</span></div>
      ${chart(runs)}</section>
    <section class="panel"><h2>Benchmarks</h2>${bench}</section>
    <div class="grid">${all.map(runCard).join("")}</div>`;
  timer = setTimeout(route, 15000);
}

// ── one run ─────────────────────────────────────────────────────────────────
function callView(call, label = "") {
  const msgs = call.messages.map(m => `<div class="msg"><div class="role">${esc(m.role)}</div><pre>${esc(m.content)}</pre></div>`).join("");
  return `<details><summary>${label}<b>${esc(call.role)}</b> · ${esc(call.stage)} · ${esc(call.model)} · T=${call.temperature}</summary>
    ${msgs}<div class="msg"><div class="role">response</div><pre>${esc(call.response)}</pre></div></details>`;
}

function specialisationTable(start, latest, records, domains, specialists) {
  let h = `<table><tr><th>Specialist</th>${domains.map(d => `<th>${esc(d)}: start → now</th>`).join("")}</tr>`;
  for (const s of specialists) {
    h += `<tr><td>${esc(s)}</td>${domains.map(d => {
      const a = start?.[s]?.[d], b = latest?.[s]?.[d];
      // Same rule as DomainRecords.owner: highest record, ties to the earlier specialist.
      const owner = records ? specialists.reduce((best, o) => ((records[o]?.[d] ?? 0.5) > (records[best]?.[d] ?? 0.5) ? o : best), specialists[0]) : null;
      return `<td class="num">${pct(a)} → ${pct(b)} <span class="tag">${delta(a, b)}</span>${owner === s ? " <b title='highest running record in this domain'>owner</b>" : ""}</td>`;
    }).join("")}</tr>`;
  }
  return h + `</table>`;
}

async function runPage(name) {
  const d = await api(`/api/run?name=${enc(name)}`), r = d.report, o = d.overview, agents = o.agents, domains = o.domains;
  let h = `<div class="crumbs"><a href="#/">Overview</a> › ${esc(name)}</div><h1>${esc(name)} <span class="tag">${o.kind === "baseline" ? "untrained" : o.condition}</span></h1>
    <p class="sub">${esc(o.model)} · ${esc(o.stage)}${o.rounds_done != null ? ` · ${o.rounds_done}/${o.rounds_total} problems` : ""} · domains: ${domains.map(esc).join(", ")}</p>`;
  if (r.baseline_benchmarks.length) h += `<section class="panel">${benchTable(r.baseline_benchmarks, "Benchmarks: untrained system")}</section>`;
  if (r.final_benchmarks.length) h += `<section class="panel">${benchTable(r.final_benchmarks, "Benchmarks: after training")}</section>`;
  if (o.kind === "baseline") { $("app").innerHTML = h; return; }

  const last = r.cycles[r.cycles.length - 1];
  const specs = Object.keys((r.baseline_validation_specialists[agents[0]] || {}));
  h += `<section class="panel"><h2>Specialisation: each specialist alone, validation accuracy by domain</h2><p class="sub">"owner" = highest running record in that domain (decides who learns when nobody was right).</p>`;
  for (const a of agents) h += `<h3>Agent ${esc(a)}</h3>` + specialisationTable(r.baseline_validation_specialists[a], last?.validation_specialists[a], last?.domain_records[a], domains, specs);
  h += `</section>`;

  h += `<section class="panel"><h2>Whole agent, validation accuracy by domain</h2><table><tr><th>Cycle</th>${agents.map(a => domains.map(dm => `<th>${a}: ${esc(dm)}</th>`).join("")).join("")}</tr>
    <tr><td>0</td>${agents.map(a => domains.map(dm => `<td class="num">${pct(r.baseline_validation[a]?.[dm])}</td>`).join("")).join("")}</tr>`;
  for (const c of r.cycles) h += `<tr><td>${c.cycle}</td>${agents.map(a => domains.map(dm => `<td class="num">${pct(c.validation[a]?.[dm])}</td>`).join("")).join("")}</tr>`;
  h += `</table></section>`;

  h += `<section class="panel"><h2>Cycles</h2><table><tr><th>Cycle</th><th>Problems</th>${agents.map(a => `<th>${a}: solved · from partner · discussion changed / fixed</th>`).join("")}<th>Answers differ / verdicts differ</th><th>Rolled back</th></tr>`;
  for (const c of r.cycles) h += `<tr><td>${c.cycle}</td><td><a href="#/run/${enc(name)}/c/${c.cycle}">browse ${c.rounds}</a></td>${agents.map(a => `<td class="num">${pct(mean(c.solved_rate[a]))} · ${c.learned_from_peer[a] ?? 0} · ${pct(c.discussion_changed[a])} / ${pct(c.discussion_fixed[a])}</td>`).join("")}<td class="num">${pct(c.answer_divergence)} / ${pct(c.outcome_disagreement)}</td><td>${c.rolled_back.join(", ") || "–"}</td></tr>`;
  for (const c of d.round_cycles.filter(c => c > r.cycles.length)) h += `<tr><td>${c}</td><td><a href="#/run/${enc(name)}/c/${c}">browse (in progress)</a></td><td colspan="${agents.length + 2}"></td></tr>`;
  h += `</table></section>`;

  for (const c of [...r.cycles].reverse()) {
    h += `<section class="panel"><h2>Cycle ${c.cycle} · sleep</h2><h3>Who learned what (competition: winners, or the domain owner if nobody was right)</h3>
      <table><tr><th>Agent</th><th>Part</th><th>Pairs</th><th>By domain</th><th>Steps</th><th>Final loss</th><th>Reward accuracy</th><th>Reward margin</th><th></th></tr>`;
    for (const a of agents) {
      const pairs = c.preference_pairs[a] || {}, tr = (c.training || {})[a] || {};
      for (const role of Object.keys(pairs)) {
        const t = tr[role], byd = (c.pairs_by_domain[a] || {})[role] || {};
        h += `<tr><td>${a}</td><td>${role}</td><td class="num">${pairs[role]}</td><td>${Object.entries(byd).map(([k, v]) => `${esc(k)} ${v}`).join(", ")}</td>
          <td class="num">${t ? t.steps : "not trained"}</td><td class="num">${t ? num(t.loss) : ""}</td><td class="num">${t ? pct(t.reward_accuracy) : ""}</td><td class="num">${t ? num(t.reward_margin) : ""}</td>
          <td>${pairs[role] ? `<a href="#/run/${enc(name)}/pairs/${a}/${role}/${c.cycle}">pairs</a>` : ""}</td></tr>`;
      }
    }
    h += `</table><h3>Lessons held after this sleep</h3>`;
    for (const a of agents) {
      h += `<b>Agent ${a}</b><ul>${(c.lessons[a] || []).map(l => `<li>${esc(l)}</li>`).join("") || "<li>–</li>"}</ul>`;
      if ((c.reflections || {})[a]) h += callView(c.reflections[a]);
    }
    h += `</section>`;
  }
  h += `<section class="panel"><h2>Log</h2><pre>${esc(d.log.join("\n"))}</pre></section>`;
  $("app").innerHTML = h;
  if (o.stage !== "finished") timer = setTimeout(route, 30000);
}

async function roundsPage(name, cycle) {
  const rows = await api(`/api/rounds?name=${enc(name)}&cycle=${cycle}`);
  const agents = rows.length ? Object.keys(rows[0].agents) : [];
  let h = `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/run/${enc(name)}">${esc(name)}</a> › cycle ${cycle}</div><h1>Cycle ${cycle}: ${rows.length} problems</h1>
    <section class="panel"><table><tr><th>#</th><th>Domain</th><th>Problem</th>${agents.map(a => `<th>Agent ${a}</th>`).join("")}</tr>`;
  for (const r of rows) h += `<tr><td>${r.i + 1}</td><td>${esc(r.domain)}</td><td><a href="#/run/${enc(name)}/c/${cycle}/r/${r.i}">${esc(r.task_id)}</a></td>${agents.map(a => {
    const s = r.agents[a];
    return `<td>${mark(s.solved)} ${s.attempts} attempt${s.attempts > 1 ? "s" : ""} · answered ${s.answers.map(esc).join(" → ")}${s.learned_from && s.learned_from !== a ? ` · <b>learned from ${esc(s.learned_from)}</b>` : ""}</td>`;
  }).join("")}</tr>`;
  $("app").innerHTML = h + `</table></section>`;
  timer = setTimeout(route, 30000);
}

async function roundPage(name, cycle, i) {
  const r = await api(`/api/round?name=${enc(name)}&cycle=${cycle}&i=${i}`), t = r.task;
  const hidden = t.kind === "code" ? [t.setup_code, ...t.tests].filter(Boolean).join("\n") : `Correct answer: ${t.answer}`;
  let h = `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/run/${enc(name)}">${esc(name)}</a> › <a href="#/run/${enc(name)}/c/${cycle}">cycle ${cycle}</a> › ${esc(t.task_id)}
    · <a href="#/run/${enc(name)}/c/${cycle}/r/${Math.max(0, i - 1)}">‹ prev</a> · <a href="#/run/${enc(name)}/c/${cycle}/r/${i + 1}">next ›</a></div>
    <h1>${esc(t.task_id)} <span class="tag">${esc(t.domain)}</span></h1>
    <section class="panel"><h2>Problem (what agents see)</h2><pre>${esc(t.prompt)}${t.choices.length ? "\n\n" + t.choices.map((c, k) => `${"ABCDEFGHIJ"[k]}. ${c}`).join("\n") : ""}</pre>
    <details><summary>Held by the environment, never shown to agents</summary><pre>${esc(hidden)}</pre></details></section>`;
  for (const [agent, res] of Object.entries(r.results)) {
    const known = r.known[agent], correct = r.correct[agent] || {};
    h += `<section class="panel"><h2>Agent ${esc(agent)} ${mark(res.decisions.some(d => d.result.passed))}</h2>`;
    if (known) h += `<p>Knows a correct answer, found by <b>${known.found_by === agent ? "itself" : "agent " + esc(known.found_by)}</b>.</p>`;
    for (const d of res.decisions) {
      const label = (stage, role) => { const v = correct[`${d.attempt_number}:${stage}:${role}`]; return v == null ? "" : (v ? `<span class="ok">right</span> · ` : `<span class="no">wrong</span> · `); };
      h += `<div class="attempt"><b>Attempt ${d.attempt_number}</b> — final answer <code>${esc(t.kind === "code" ? "(code)" : d.answer)}</code> —
        world: ${d.result.passed ? `<span class="ok">accepted</span>` : `<span class="no">${esc(d.result.feedback)}</span>`}
        ${t.kind === "code" ? `<span class="tag">env: ${d.result.tests_passed}/${d.result.tests_total} tests</span>` : ""}
        <h3>1 · Each specialist alone</h3>${d.calls.filter(c => c.stage === "round1").map(c => callView(c, label(1, c.role))).join("")}
        <h3>2 · Discussion</h3>${d.calls.filter(c => c.stage === "round2").map(c => callView(c, label(2, c.role))).join("") || "<p class='sub'>(discussion off)</p>"}
        <h3>3 · Coordinator decides</h3>${d.calls.filter(c => c.stage === "decide").map(c => callView(c)).join("")}</div>`;
    }
    if (r.probe_calls && r.probe_calls[agent]) h += `<h3>Credit assignment: example calls the agent wrote</h3><pre>${esc((r.probes[agent] || []).join("\n") || "(none parsed)")}</pre>${callView(r.probe_calls[agent])}`;
    h += `</section>`;
  }
  $("app").innerHTML = h;
}

async function pairsPage(name, agent, role, cycle) {
  const pairs = await api(`/api/pairs?name=${enc(name)}&agent=${enc(agent)}&role=${enc(role)}&cycle=${cycle}`);
  let h = `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/run/${enc(name)}">${esc(name)}</a> › cycle ${cycle} › agent ${esc(agent)} · ${esc(role)}</div>
    <h1>Training pairs: agent ${esc(agent)}, ${esc(role)}, cycle ${cycle}</h1><p class="sub">Each pair teaches: prefer "chosen" over "rejected" for this prompt. Showing up to 30.</p>`;
  pairs.forEach((p, k) => {
    h += `<section class="panel"><h2>Pair ${k + 1}</h2><details><summary>Prompt</summary>${p.prompt.map(m => `<div class="msg"><div class="role">${esc(m.role)}</div><pre>${esc(m.content)}</pre></div>`).join("")}</details>
      <div class="msg"><div class="role ok">chosen</div><pre>${esc(p.chosen[0].content)}</pre></div><div class="msg"><div class="role no">rejected</div><pre>${esc(p.rejected[0].content)}</pre></div></section>`;
  });
  $("app").innerHTML = h;
}

// ── routing ─────────────────────────────────────────────────────────────────
async function route() {
  clearTimeout(timer);
  const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  try {
    if (p[0] === "run" && p[2] === "c" && p[4] === "r") await roundPage(p[1], +p[3], +p[5]);
    else if (p[0] === "run" && p[2] === "c") await roundsPage(p[1], +p[3]);
    else if (p[0] === "run" && p[2] === "pairs") await pairsPage(p[1], p[3], p[4], +p[5]);
    else if (p[0] === "run") await runPage(p[1]);
    else await overview();
  } catch (e) {
    $("app").innerHTML = `<p class="sub">Not available yet (${esc(e.message)}). <a href="#/">Back to overview</a></p>`;
    timer = setTimeout(route, 15000);
  }
}
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });
document.addEventListener("mousemove", (ev) => {
  const t = ev.target.closest?.("[data-tip]"), tip = $("tip");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = "block";
  tip.style.left = (ev.clientX + 12) + "px"; tip.style.top = (ev.clientY + 12) + "px";
});
route();
</script>
</body>
</html>
